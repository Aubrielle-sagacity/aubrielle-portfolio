const section=document.querySelector('.photo-wrap'), photos=[...document.querySelectorAll('.slides .photo')], reduced=matchMedia('(prefers-reduced-motion: reduce)');
function paint(){if(reduced.matches){photos.forEach(p=>{p.style.transform='';p.style.opacity=''});return}const rect=section.getBoundingClientRect(), sticky=document.querySelector('.photo-sticky');const distance=Math.max(1,rect.height-sticky.offsetHeight);const progress=Math.max(0,Math.min(1,-rect.top/distance));photos.forEach((p,i)=>{if(i===0){p.style.transform='translateY(0) rotate(0deg)';p.style.opacity='1';return}const t=Math.max(0,Math.min(1,progress*(photos.length-1)-(i-1)));const ease=1-Math.pow(1-t,3);p.style.transform=`translateY(${(1-ease)*75}vh) rotate(${(i%2?2:-2)*ease}deg)`;p.style.opacity=String(Math.min(1,t*4));p.style.zIndex=String(i+1)})}
