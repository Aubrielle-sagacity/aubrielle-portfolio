效果验证。</p></div><img class="hero-portrait" src="cv-portrait.jpg" alt="蔡雨昕证件照"></div><div class="choices" id="choices"></div></section><section class="panel" id="panel" aria-live="polite"><div class="panel-top"><h2 class="panel-heading" id="panel-heading"></h2><button class="back" id="back">返回目录</button></div><div class="panel-body" id="panel-body"></div><div class="panel-footer"><button id="previous">上一部分</button><button id="next">下一部分</button></div></section></main><script>
const contents=["<div class=\"about-content\"><p class=\"about-lead\">策略运营 · 内容安全与 AI 场景</p><p>关注 AI 陪伴与 AIGC 场景中的内容安全、模型评测与策略优化。擅长从客户反馈和评测案例中梳理问题，结合业务场景推动策略调整及效果验证。</p><a href=\"mailto:yxcai67@gmail.com\">yxcai67@gmail.com</a></div>", "<div class=\"label\"><h2>工作经历</h2></div><div><article class=\"entry\"><div class=\"entry-head\"><h3>北京数美天下科技有限公司</h3><span class=\"date\">2026.03 — 至今</span></div><div class=\"role\">策略运营 · 2026 年 3 月起实习，7 月起正式入职</div><p>负责海外 AIGC 客户内容安全策略与效果优化，涵盖客户需求分析、模型评测、案例归因、策略调整、阈值调优与变量配置。</p><ul><li><strong>模型评测与客户验收：</strong>针对 SpicyChat 自杀自残审核效果开展评测与验收支持，分析漏杀及争议案例，协调优化；标签修正和研发优化后，原测试集复测准确率达 <em class=\"inline-result\">92.7%</em>。</li><li><strong>策略调优与闭环：</strong>围绕元象 AI 陪伴场景分析图文审核案例，提炼细分特征、配置变量并跟进上线，回溯验证客户要求。</li><li><strong>用户场景与体验：</strong>跟进 Pollo AI 未成年人文本审核优化，结合客户反馈与文生图测试明确判断边界，推动相关策略优化上线。</li><li><strong>电商建模场景：</strong>针对 Tripo AI 雕塑素材误杀，使用 SQL 分析阈值并配置策略，场景图片审核准确率由 <em class=\"inline-result\">37% 提升至 96%</em>。</li><li><strong>多语言评测：</strong>独立设计并执行 SpicyChat 九种语言翻译准确率测评，整理不同批次结果。</li></ul><a class=\"button\" href=\"https://aubrielle-sagacity.github.io/aubrielle-portfolio/\">查看项目详情 →</a></article></div>", "<div class=\"label\"><h2>副业与个人项目</h2></div><div><article class=\"entry\"><div class=\"entry-head\"><h3>新闻发布与 AI 搜索可见度服务</h3></div><div class=\"role\">新闻传播 · 资源对接</div><p>对接国家级、省级新闻发布渠道，根据客户需求匹配媒体资源；承接 Kimi、DeepSeek、豆包等 AI 平台相关内容传播需求，帮助客户提升内容被搜索或引用的机会。</p></article><article class=\"entry\"><div class=\"entry-head\"><h3>宠物内容与社群活动运营</h3></div><div class=\"role\">内容创作 · 社区运营 · 活动策划</div><ul><li><strong>内容与社群：</strong>独立运营宠物类小红书、抖音账号，累计获得武汉社区垂类 2,000+ 粉丝，负责选题、用户互动与社群维护。</li><li><strong>线下活动：</strong>主导策划并落地 100+ 人参与的万圣节小狗主题派对，负责报名审核、活动流程、场地协调、现场执行及活动注意事项；其他萨摩耶聚会以协助为主，系列活动累计近十场。</li><li><strong>品牌合作：</strong>主导合作方沟通与权益确认，推动与宠胖胖、派膳师、高合、众安保险等品牌合作，核对宣传信息和执行要求。</li><li><strong>表情包创作：</strong>独立策划并制作宠物主题微信表情包系列，累计下载量 3 万+。</li></ul></article></div>", "<div class=\"label\"><h2>教育经历</h2></div><div><article class=\"entry\"><div class=\"entry-head\"><h3>湖南师范大学（211）</h3></div><div class=\"role\">会计学 · ACCA 专业</div></article></div>", "<div class=\"label\"><h2>技能与关注</h2></div><div class=\"tags\"><span>模型评测</span><span>内容安全策略</span><span>案例分析</span><span>SQL</span><span>Python</span><span>Prompt 设计</span><span>AI 工具应用</span><span>英语与德语学习</span></div>"];const titles=['工作经历','副业与个人项目','教育经历','技能与关注'];const choices=document.querySelector('#choices'),full=document.querySelector('#full');const groups=[];function toggle(group,open){const btn=group.querySelector('.choice');group.classList.toggle('is-open',open);btn.setAttribute('aria-expanded',String(open));group.querySelector('.choice-clip').inert=!open;const allOpen=groups.length>0&&groups.every(g=>g.classList.contains('is-open'));full.textContent=allOpen?'收起完整简历':'查看完整简历';full.setAttribute('aria-expanded',String(allOpen))}titles.forEach((title,i)=>{const group=document.createElement('section');group.className='choice-group';const btn=document.createElement('button');btn.className='choice';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls','section-'+i);const left=document.createElement('span');const name=document.createElement('span');name.className='choice-title';name.textContent=title;left.append(name);const plus=document.createElement('i');plus.setAttribute('aria-hidden','true');plus.textContent='+';btn.append(left,plus);const reveal=document.createElement('div');reveal.className='choice-reveal';reveal.id='section-'+i;const clip=document.createElement('div');clip.className='choice-clip';clip.inert=true;const content=document.createElement('div');content.className='choice-body';content.innerHTML='<div class="block">'+contents[i+1]+'</div>';clip.append(content);reveal.append(clip);group.append(btn,reveal);btn.onclick=()=>toggle(group,!group.classList.contains('is-open'));groups.push(group);choices.append(group)});full.setAttribute('aria-expanded','false');full.addEventListener('click',()=>{const shouldOpen=!groups.every(g=>g.classList.contains('is-open'));groups.forEach(g=>toggle(g,shouldOpen));if(shouldOpen)choices.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});</script></body></html>
